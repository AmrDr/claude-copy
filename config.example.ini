# Claude Copy configuration
#
# After install, the active copy of this file lives at:
#   Windows:  %LOCALAPPDATA%\ClaudeCopy\config.ini
#   macOS:    ~/.config/claude-copy/config.ini
#   Linux:    ~/.config/claude-copy/config.ini
#
# Re-running the installer with no flags will NOT overwrite your edits.
# After editing, reload the hotkey:
#   Windows: re-run install.ps1, or relaunch claude-copy.ahk
#   macOS:   Hammerspoon menu-bar icon -> Reload Config
#   Linux:   takes effect on the next press (the wrapper reads it each time)

[hotkey]
# Format: <modifier>+<modifier>+...+<key>
# Modifiers:  ctrl  alt  shift  super  (super = Win key / cmd on macOS)
# Examples:   ctrl+alt+c     ctrl+shift+y     super+c     alt+v
#
# On Linux the hotkey is registered by your desktop / window manager,
# not by Claude Copy itself - this value is informational and the
# installer prints platform-specific binding hints.
combo = ctrl+alt+c

[copy]
# What to copy from Claude's most recent response:
#   text         Claude's answer text only (including ``` blocks in the answer)
#   text+code    + commands Claude ran and files it wrote/edited
#   everything   + the output of every tool call
mode = text

# In 'everything' mode, truncate each tool output to this many characters.
# 0 means no limit. Useful to avoid pasting huge command output.
max_tool_output_chars = 0
